<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heddee Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { font-family:'Prompt',sans-serif; }
    table{border-collapse:collapse;width:100%}
    td,th{border:1px solid #e5e7eb;padding:6px 10px;font-size:12px;text-align:left}
    th{background:#f9fafb;font-weight:700;}
    .hide-scrollbar::-webkit-scrollbar{display:none}
    .hide-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .3s ease-out forwards}
    .tab-active{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;}
    .tab-inactive{background:#e5e7eb;color:#6b7280;}
    .status-pending{background:#fef3c7;color:#d97706;}
    .status-confirmed{background:#dbeafe;color:#2563eb;}
    .status-delivered{background:#d1fae5;color:#059669;}
    .status-cancelled{background:#fee2e2;color:#dc2626;}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.15);}
  </style>
</head>
<body class="bg-gray-50 p-4">

<div class="max-w-7xl mx-auto">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-black text-gray-900"><img src="/assets/logo.png" class="h-8 w-8 inline-block align-middle mr-2"> Heddee Admin Panel</h1>
      <p class="text-sm text-gray-500">จัดการระบบทั้งหมด</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="adminStatus" class="text-sm font-bold text-red-500">กำลังตรวจสอบสิทธิ์…</span>
      <button onclick="logout()" class="text-xs font-bold text-gray-400 hover:text-red-500 transition">🚪 ออก</button>
    </div>
  </div>

  <!-- Nav tabs -->
  <div class="flex flex-wrap gap-1.5 mb-6 hide-scrollbar overflow-x-auto">
    <button onclick="showSection('dashboard')"  class="admin-tab px-3 py-2 rounded-lg text-xs font-bold tab-active">📊 Dashboard</button>
    <button onclick="showSection('users')"      class="admin-tab px-3 py-2 rounded-lg text-xs font-bold tab-inactive">👥 Users</button>
    <button onclick="showSection('missions')"   class="admin-tab px-3 py-2 rounded-lg text-xs font-bold tab-inactive">🏆 Missions</button>
    <button onclick="showSection('rewards')"    class="admin-tab px-3 py-2 rounded-lg text-xs font-bold tab-inactive">🎁 Rewards</button>
    <button onclick="showSection('foodLogs')"   class="admin-tab px-3 py-2 rounded-lg text-xs font-bold tab-inactive">🍱 Food Logs</button>
    <button onclick="showSection('exerciseLogs')" class="admin-tab px-3 py-2 rounded-lg text-xs font-bold tab-inactive">🏃 Exercise</button>
    <button onclick="showSection('healthLogs')" class="admin-tab px-3 py-2 rounded-lg text-xs font-bold tab-inactive">📋 Health Logs</button>
    <button onclick="showSection('bodyStats')"  class="admin-tab px-3 py-2 rounded-lg text-xs font-bold tab-inactive">📊 Body Stats</button>
    <button onclick="showSection('reminders')"  class="admin-tab px-3 py-2 rounded-lg text-xs font-bold tab-inactive">⏰ Reminders</button>
    <button onclick="showSection('redemptions')" class="admin-tab px-3 py-2 rounded-lg text-xs font-bold tab-inactive">🧾 Redemptions</button>
    <button onclick="showSection('transactions')" class="admin-tab px-3 py-2 rounded-lg text-xs font-bold tab-inactive">💰 Transactions</button>
    <button onclick="showSection('settings')"   class="admin-tab px-3 py-2 rounded-lg text-xs font-bold tab-inactive">⚙️ Settings</button>
  </div>

  <!-- Section Content -->
  <div id="sectionContent" class="bg-white border border-gray-200 rounded-xl p-4 overflow-x-auto min-h-64">
    <p class="text-gray-400 text-sm">เลือกหัวข้อด้านบน</p>
  </div>

  <!-- ===== MODALS ===== -->

  <!-- Reward Modal -->
  <div id="rewardModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
      <h2 id="rewardModalTitle" class="font-black text-gray-800 mb-4">➕ เพิ่มของรางวัล</h2>
      <div class="space-y-3 mb-4">
        <div><label class="text-xs font-bold text-gray-500">ชื่อรางวัล *</label>
          <input id="rTitle" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="Starbucks Gift Card"></div>
        <div><label class="text-xs font-bold text-gray-500">แต้มที่ต้องใช้ *</label>
          <input id="rPoints" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="500"></div>
        <div><label class="text-xs font-bold text-gray-500">emoji / ไอคอน</label>
          <input id="rImage" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="☕"></div>
        <div><label class="text-xs font-bold text-gray-500">คำอธิบาย</label>
          <input id="rDesc" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="คำอธิบายรางวัล"></div>
        <div><label class="text-xs font-bold text-gray-500">สต็อก (0 = ไม่จำกัด)</label>
          <input id="rStock" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="0" value="0"></div>
        <div><label class="text-xs font-bold text-gray-500">สถานะ</label>
          <select id="rActive" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
            <option value="true">เปิดใช้งาน</option>
            <option value="false">ปิดใช้งาน</option>
          </select></div>
      </div>
      <div class="flex gap-2">
        <button onclick="saveReward()" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold px-4 py-2 rounded-lg text-sm">💾 บันทึก</button>
        <button onclick="closeRewardModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold px-4 py-2 rounded-lg text-sm">ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- Mission Modal -->
  <div id="missionModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
      <h2 id="missionModalTitle" class="font-black text-gray-800 mb-4">➕ เพิ่มภารกิจ</h2>
      <div class="space-y-3 mb-4">
        <div><label class="text-xs font-bold text-gray-500">ชื่อภารกิจ *</label>
          <input id="mTitle" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="บันทึกอาหาร 3 มื้อ"></div>
        <div><label class="text-xs font-bold text-gray-500">แต้มที่ได้รับ *</label>
          <input id="mPoints" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="50"></div>
        <div><label class="text-xs font-bold text-gray-500">emoji</label>
          <input id="mIcon" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="🍱"></div>
        <div><label class="text-xs font-bold text-gray-500">คำอธิบาย</label>
          <input id="mDesc" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="บันทึกอาหารครบ 3 มื้อ"></div>

        <!-- ═══ รอบรีเซ็ต ═══ -->
        <div><label class="text-xs font-bold text-gray-500">รอบรีเซ็ต *</label>
          <select id="mResetType" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" onchange="updateMissionPreview()">
            <option value="daily">📅 รายวัน</option>
            <option value="weekly">📆 รายสัปดาห์</option>
          </select></div>

        <!-- ═══ Template เงื่อนไข ═══ -->
        <div><label class="text-xs font-bold text-gray-500">เงื่อนไขภารกิจ *</label>
          <select id="mConditionTemplate" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" onchange="onMissionTemplateChange()">
            <option value="record_count">📝 บันทึกครบตามจำนวนครั้ง</option>
            <option value="calorie_goal">🎯 แคลอรี่ไม่เกินเป้าหมาย</option>
            <option value="exercise_goal">🏃 เบิร์นแคลอรี่ตามเป้าหมาย</option>
          </select></div>

        <!-- ── พารามิเตอร์: record_count ── -->
        <div id="mParamRecord" class="space-y-3">
          <div><label class="text-xs font-bold text-gray-500">ต้องบันทึกอะไร</label>
            <select id="mDataType" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" onchange="updateMissionPreview()">
              <option value="food">🍱 อาหาร</option>
              <option value="weight">⚖️ ชั่งน้ำหนัก</option>
              <option value="sugar">🩸 ค่าน้ำตาล</option>
              <option value="pressure">💓 ความดัน</option>
              <option value="health">📋 สุขภาพทั่วไป</option>
              <option value="exercise">🏃 ออกกำลังกาย</option>
            </select></div>
          <div><label class="text-xs font-bold text-gray-500">จำนวนครั้งที่ต้องบันทึก</label>
            <input id="mCount" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="3" value="1" min="1" oninput="updateMissionPreview()"></div>
        </div>

        <!-- ── พารามิเตอร์: calorie_goal ── -->
        <div id="mParamCalorie" class="hidden space-y-3">
          <div><label class="text-xs font-bold text-gray-500">แคลอรี่สูงสุดที่อนุญาต (kcal/วัน)</label>
            <input id="mCalValue" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="2000" value="2000" oninput="updateMissionPreview()"></div>
        </div>

        <!-- ── พารามิเตอร์: exercise_goal ── -->
        <div id="mParamExercise" class="hidden space-y-3">
          <div><label class="text-xs font-bold text-gray-500">แคลอรี่ที่ต้องเบิร์น (kcal)</label>
            <input id="mExValue" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="300" value="300" oninput="updateMissionPreview()"></div>
          <div><label class="text-xs font-bold text-gray-500">จำนวนวันที่ต้องออกกำลังกาย</label>
            <input id="mExDays" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="3" value="3" min="1" oninput="updateMissionPreview()"></div>
        </div>

        <!-- ═══ Preview ═══ -->
        <div id="mConditionPreview" class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-lg p-3 text-center">
          <p class="text-xs text-blue-400 font-bold">👁️ ตัวอย่างเงื่อนไข</p>
          <p id="mPreviewText" class="text-sm font-bold text-blue-700 mt-1">บันทึกอาหาร 1 ครั้ง</p>
        </div>

        <div><label class="text-xs font-bold text-gray-500">สถานะ</label>
          <select id="mActive" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
            <option value="true">เปิดใช้งาน</option>
            <option value="false">ปิดใช้งาน</option>
          </select></div>
      </div>
      <div class="flex gap-2">
        <button onclick="saveMission()" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold px-4 py-2 rounded-lg text-sm">💾 บันทึก</button>
        <button onclick="closeMissionModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold px-4 py-2 rounded-lg text-sm">ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- User Edit Modal -->
  <div id="userEditModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto">
      <h2 class="font-black text-gray-800 mb-4">✏️ แก้ไขผู้ใช้</h2>
      <div class="space-y-3 mb-4" id="userEditFields">
        <div><label class="text-xs font-bold text-gray-500">UID</label>
          <p id="ue_uid" class="text-sm font-bold text-gray-800 bg-gray-50 px-3 py-2 rounded-lg mt-1"></p></div>
        <div><label class="text-xs font-bold text-gray-500">ชื่อ</label>
          <input id="ue_name" class="w-full border rounded-lg px-3 py-2 text-sm mt-1"></div>
        <div><label class="text-xs font-bold text-gray-500">อีเมล</label>
          <input id="ue_email" class="w-full border rounded-lg px-3 py-2 text-sm mt-1"></div>
        <div><label class="text-xs font-bold text-gray-500">แต้ม</label>
          <input id="ue_points" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1"></div>
        <div><label class="text-xs font-bold text-gray-500">เป้าหมายแคลอรี่ (kcal)</label>
          <input id="ue_calorieGoal" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1"></div>
        <div><label class="text-xs font-bold text-gray-500">เป้าหมายออกกำลังกาย (kcal)</label>
          <input id="ue_exerciseGoal" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1"></div>
        <div><label class="text-xs font-bold text-gray-500">ส่วนสูงเริ่มต้น (cm)</label>
          <input id="ue_height" type="number" step="0.1" class="w-full border rounded-lg px-3 py-2 text-sm mt-1"></div>
        <div><label class="text-xs font-bold text-gray-500">น้ำหนักเริ่มต้น (kg)</label>
          <input id="ue_weight" type="number" step="0.1" class="w-full border rounded-lg px-3 py-2 text-sm mt-1"></div>
        <div><label class="text-xs font-bold text-gray-500">วันเกิด</label>
          <input id="ue_birth" type="date" class="w-full border rounded-lg px-3 py-2 text-sm mt-1"></div>
        <div><label class="text-xs font-bold text-gray-500">LINE UID</label>
          <input id="ue_lineUid" class="w-full border rounded-lg px-3 py-2 text-sm mt-1"></div>
        <div><label class="text-xs font-bold text-gray-500">เบอร์โทร</label>
          <input id="ue_phone" class="w-full border rounded-lg px-3 py-2 text-sm mt-1"></div>
      </div>
      <div class="flex gap-2">
        <button onclick="saveUserEdit()" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold px-4 py-2 rounded-lg text-sm">💾 บันทึก</button>
        <button onclick="closeUserEditModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold px-4 py-2 rounded-lg text-sm">ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- Redemption Status Modal -->
  <div id="redemptionModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
      <h2 class="font-black text-gray-800 mb-4">📦 จัดการคำขอแลกของ</h2>
      <div id="redemptionDetail" class="space-y-3 mb-4"></div>
      <div class="space-y-3 mb-4">
        <div><label class="text-xs font-bold text-gray-500">สถานะ</label>
          <select id="rm_status" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
            <option value="pending">⏳ รอยืนยัน</option>
            <option value="confirmed">✅ ยืนยันแล้ว</option>
            <option value="delivered">📬 ส่งแล้ว</option>
            <option value="cancelled">❌ ยกเลิก</option>
          </select></div>
        <div><label class="text-xs font-bold text-gray-500">หมายเหตุ</label>
          <textarea id="rm_note" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="หมายเหตุเพิ่มเติม"></textarea></div>
      </div>
      <div class="flex gap-2">
        <button onclick="saveRedemptionStatus()" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold px-4 py-2 rounded-lg text-sm">💾 อัปเดต</button>
        <button onclick="closeRedemptionModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold px-4 py-2 rounded-lg text-sm">ปิด</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
      <h2 class="font-black text-gray-800 mb-4">⚙️ ตั้งค่าระบบ</h2>
      <div class="space-y-4 mb-4" id="settingsFields">
        <div>
          <label class="text-xs font-bold text-gray-500">ค่าเริ่มต้นเป้าหมายแคลอรี่ (kcal)</label>
          <input id="s_defaultCalorieGoal" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="2000">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-500">ค่าเริ่มต้นเป้าหมายออกกำลังกาย (kcal)</label>
          <input id="s_defaultExerciseGoal" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="300">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-500">Admin UIDs (คั่นด้วยคอมม่า)</label>
          <textarea id="s_adminUids" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" placeholder="uid1,uid2,uid3"></textarea>
        </div>
        <div>
          <label class="text-xs font-bold text-gray-500">เปิด/ปิด ระบบ LINE Notify</label>
          <select id="s_lineNotify" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
            <option value="true">เปิด</option>
            <option value="false">ปิด</option>
          </select>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="saveSettings()" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold px-4 py-2 rounded-lg text-sm">💾 บันทึก</button>
        <button onclick="closeSettingsModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold px-4 py-2 rounded-lg text-sm">ปิด</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg font-bold shadow-lg z-40"></div>
</div>

<script type="module">
  import { db, ADMIN_UIDS } from '../lib/firebase.js';
  import { getSession, clearSession } from '../lib/auth.js';
  import {
    collection, getDocs, doc, deleteDoc, addDoc, updateDoc, query, where, getDoc, orderBy, limit, setDoc
  } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
  import { getAuth, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
  import { auth } from '../lib/firebase.js';

  // ── XSS Protection ──
  const escapeHtml = (val) => {
    const str = val === null || val === undefined ? '–' : (typeof val === 'object' ? JSON.stringify(val) : String(val));
    return str.replace(/[&<>"']/g, (ch) => ({
      '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#39;'
    }[ch]));
  };

  // ── Auth Check ──
  const session = getSession();
  const isAdmin = session?.uid && ADMIN_UIDS.includes(session.uid);

  if (session?.uid) {
    sessionStorage.setItem('vv_isAdmin', isAdmin);
  }

  document.getElementById('adminStatus').textContent = isAdmin ? '✅ Admin' : '❌ ไม่มีสิทธิ์';
  document.getElementById('adminStatus').className = isAdmin
    ? 'text-sm font-bold text-green-600'
    : 'text-sm font-bold text-red-500';

  if (!isAdmin && session?.uid) {
    document.getElementById('sectionContent').innerHTML = `
      <div class="bg-red-50 border border-red-200 rounded-lg p-6">
        <p class="text-red-600 font-bold text-lg mb-2">❌ ไม่มีสิทธิ์เข้าถึง Admin Panel</p>
        <p class="text-red-500 text-sm mb-3">UID ของคุณ: <code class="bg-red-100 px-2 py-1 rounded">${escapeHtml(session.uid)}</code></p>
        <p class="text-red-500 text-xs">หากคุณควรเป็น admin โปรดติดต่อผู้ดูแลระบบ</p>
      </div>
    `;
  } else if (!session?.uid) {
    document.getElementById('sectionContent').innerHTML = `
      <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-6">
        <p class="text-yellow-600 font-bold text-lg">⚠️ ยังไม่ได้เข้าสู่ระบบ</p>
        <p class="text-yellow-500 text-sm mt-2">กรุณา <a href="/login.html?redirect=/admin/index.html" class="underline font-bold">เข้าสู่ระบบ</a> ก่อน</p>
      </div>
    `;
  }

  let currentSection = '';
  let editingRewardId = null;
  let editingMissionId = null;
  let editingUserId = null;
  let editingRedemptionId = null;
  let dashboardChartInstance = null; // ➕ FIX: เก็บ instance ของกราฟไว้ เพื่อ destroy ก่อนสร้างใหม่

  // ── Toast ──
  const showToast = (msg, type = 'success') => {
    const toast = document.getElementById('toast');

  const buildConditionFromForm = () => {
    const template = document.getElementById('mConditionTemplate').value;
    const resetType = document.getElementById('mResetType').value;
    const base = { template, resetType };

    if (template === 'record_count') {
      const dataType = document.getElementById('mDataType').value;
      const count = parseInt(document.getElementById('mCount').value) || 1;
      return { ...base, dataType, count };
    }

    const el = document.getElementById('sectionContent');
    if (!reminders.length) {
      el.innerHTML = '<p class="text-gray-400 text-sm p-4">ไม่มีข้อมูลแจ้งเตือน</p>';
      return;
    }
    let html = `<div class="flex justify-between items-center mb-3">
      <p class="text-sm font-bold text-gray-600">${reminders.length} รายการ</p>
    </div><div class="overflow-x-auto"><table><thead><tr>
      <th>#</th><th>ผู้ใช้</th><th>ประเภท</th><th>ชื่อ</th><th>📅 กำหนด</th><th>🔁 ซ้ำ</th><th>📝 หมายเหตุ</th><th>สถานะ</th><th>Action</th>
    </tr></thead><tbody>`;

    reminders.forEach((r, i) => {
      const repeatText = r.repeatDays?.length ? (r.repeatDays.length === 7 ? 'ทุกวัน' : `${r.repeatDays.length} วัน`) : 'ไม่ซ้ำ';
      const statusClass = r.status === 'done' ? 'text-green-600' : r.status === 'active' ? 'text-blue-600' : 'text-gray-400';
      html += `<tr>
        <td>${i + 1}</td>
        <td class="font-mono text-xs" title="${escapeHtml(r.uid)}">${escapeHtml((r.uid || '').slice(0, 10))}…</td>
        <td>${r.type === 'appointment' ? '🩺 หมอนัด' : '💊 กินยา'}</td>
        <td class="font-bold">${escapeHtml(r.title || '–')}</td>
        <td>${fmtDate(r.scheduledAt)}</td>
        <td class="text-xs">${repeatText}</td>
        <td class="max-w-xs truncate text-xs">${escapeHtml(r.note || '')}</td>
        <td class="font-bold ${statusClass}">${r.status || 'active'}</td>
        <td><button onclick="deleteRow('${r._id}','reminders')" class="text-red-400 hover:text-red-600 text-xs font-bold">🗑</button></td>
      </tr>`;
    });
    html += '</tbody></table></div>';
    el.innerHTML = html;
  };

  // ============================================================
  // 🧾 REDEMPTIONS
  // ============================================================
  const renderRedemptions = (redemptions) => {
    const el = document.getElementById('sectionContent');
    if (!redemptions.length) {
      el.innerHTML = '<p class="text-gray-400 text-sm p-4">ไม่มีคำขอแลกของ</p>';
      return;
    }
    const pending = redemptions.filter(r => r.status === 'pending').length;
    let html = `<div class="flex justify-between items-center mb-3">
      <p class="text-sm font-bold text-gray-600">${redemptions.length} รายการ | ⏳ รออนุมัติ ${pending} รายการ</p>
    </div><div class="overflow-x-auto"><table><thead><tr>
      <th>#</th><th>วันที่</th><th>ผู้ใช้</th><th>รางวัล</th><th>💰 แต้ม</th><th>📦 สถานะ</th><th>👤 ผู้รับ</th><th>📱 เบอร์</th><th>📧 อีเมล</th><th>📍 ที่อยู่</th><th>📝 หมายเหตุ</th><th>Action</th>
    </tr></thead><tbody>`;

    redemptions.forEach((r, i) => {
      const addr = r.shippingAddress || {};
      const statusColors = {
        pending: 'status-pending',
        confirmed: 'status-confirmed',
        delivered: 'status-delivered',
        cancelled: 'status-cancelled'
      };
      const statusLabels = {
        pending: '⏳ รอยืนยัน',
        confirmed: '✅ ยืนยันแล้ว',
        delivered: '📬 ส่งแล้ว',
        cancelled: '❌ ยกเลิก'
      };
      html += `<tr>
        <td>${i + 1}</td>
        <td>${fmtDate(r.redeemedAt || r.createdAt)}</td>
        <td class="font-mono text-xs" title="${escapeHtml(r.uid)}">${escapeHtml((r.uid || '').slice(0, 10))}…</td>
        <td class="font-bold">${escapeHtml(r.rewardTitle || r.title || '–')}</td>
        <td class="font-bold text-pink-600">${r.pointsCost || r.cost || 0}</td>
        <td><span class="text-xs font-bold px-2 py-1 rounded-full ${statusColors[r.status] || 'bg-gray-100'}">${statusLabels[r.status] || r.status}</span></td>
        <td>${escapeHtml(addr.recipientName || '–')}</td>
        <td>${escapeHtml(addr.recipientPhone || '–')}</td>
        <td>${escapeHtml(addr.recipientEmail || '–')}</td>
        <td class="max-w-xs truncate text-xs">${escapeHtml(addr.address || '–')}</td>
        <td class="text-xs">${escapeHtml(r.adminNote || '')}</td>
        <td>
          <button onclick="openRedemptionModal('${r._id}')" class="text-blue-500 hover:text-blue-700 text-xs font-bold">📦</button>
          <button onclick="deleteRow('${r._id}','redemptions')" class="text-red-400 hover:text-red-600 text-xs font-bold ml-1">🗑</button>
        </td>
      </tr>`;
    });
    html += '</tbody></table></div>';
    el.innerHTML = html;
  };

  // ── Redemption Modal ──
  window.openRedemptionModal = async (id) => {
    editingRedemptionId = id;
    try {
      const snap = await getDoc(doc(db, 'redemptions', id));
      if (!snap.exists()) return showToast('ไม่พบคำขอ', 'error');
      const r = snap.data();
      const addr = r.shippingAddress || {};
      document.getElementById('redemptionDetail').innerHTML = `
        <div class="bg-gray-50 rounded-lg p-3 space-y-1 text-sm">
          <p><span class="font-bold">รางวัล:</span> ${escapeHtml(r.rewardTitle || r.title || '–')}</p>
          <p><span class="font-bold">แต้ม:</span> ${r.pointsCost || r.cost || 0}</p>
          <p><span class="font-bold">วันที่:</span> ${fmtDate(r.redeemedAt || r.createdAt)}</p>
          <p><span class="font-bold">ผู้รับ:</span> ${escapeHtml(addr.recipientName || '–')}</p>
          <p><span class="font-bold">เบอร์:</span> ${escapeHtml(addr.recipientPhone || '–')}</p>
          <p><span class="font-bold">อีเมล:</span> ${escapeHtml(addr.recipientEmail || '–')}</p>
          <p><span class="font-bold">ที่อยู่:</span> ${escapeHtml(addr.address || '–')}</p>
        </div>
      `;
      document.getElementById('rm_status').value = r.status || 'pending';
      document.getElementById('rm_note').value = r.adminNote || '';
      document.getElementById('redemptionModal').classList.remove('hidden');
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    }
  };

  window.closeRedemptionModal = () => {
    document.getElementById('redemptionModal').classList.add('hidden');
    editingRedemptionId = null;
  };

  window.saveRedemptionStatus = async () => {
    if (!editingRedemptionId) return;
    const status = document.getElementById('rm_status').value;
    const note = document.getElementById('rm_note').value.trim();
    try {
      await updateDoc(doc(db, 'redemptions', editingRedemptionId), {
        status,
        adminNote: note,
        updatedAt: new Date().toISOString()
      });
      showToast('อัปเดตสถานะสำเร็จ');
      closeRedemptionModal();
      window.showSection('redemptions');
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    }
  };

  // ============================================================
  // 💰 TRANSACTIONS
  // ============================================================
  const renderTransactions = (txns) => {
    const el = document.getElementById('sectionContent');
    if (!txns.length) {
      el.innerHTML = '<p class="text-gray-400 text-sm p-4">ไม่มีรายการธุรกรรม</p>';
      return;
    }
    const totalEarn = txns.filter(t => t.type === 'earn').reduce((s, t) => s + (t.amount || 0), 0);
    const totalSpend = txns.filter(t => t.type === 'spend').reduce((s, t) => s + (t.amount || 0), 0);
    let html = `<div class="flex justify-between items-center mb-3">
      <p class="text-sm font-bold text-gray-600">${txns.length} รายการ | ⬆️ +${totalEarn.toLocaleString()} ⬇️ -${totalSpend.toLocaleString()}</p>
    </div><div class="overflow-x-auto"><table><thead><tr>
      <th>#</th><th>วันที่</th><th>ผู้ใช้</th><th>ประเภท</th><th>💰 จำนวน</th><th>📝 เหตุผล</th><th>💳 คงเหลือ</th><th>Action</th>
    </tr></thead><tbody>`;

    txns.forEach((t, i) => {
      const isEarn = t.type === 'earn';
      html += `<tr>
        <td>${i + 1}</td>
        <td>${fmtDate(t.timestamp || t.createdAt)}</td>
        <td class="font-mono text-xs" title="${escapeHtml(t.uid)}">${escapeHtml((t.uid || '').slice(0, 10))}…</td>
        <td><span class="font-bold ${isEarn ? 'text-green-600' : 'text-red-600'}">${isEarn ? '⬆️ ได้รับ' : '⬇️ ใช้'}</span></td>
        <td class="font-bold ${isEarn ? 'text-green-600' : 'text-red-600'}">${isEarn ? '+' : '-'}${(t.amount || 0).toLocaleString()}</td>
        <td class="max-w-xs truncate text-xs">${escapeHtml(t.reason || t.missionTitle || t.rewardTitle || '–')}</td>
        <td>${t.balance !== undefined ? t.balance.toLocaleString() : '–'}</td>
        <td><button onclick="deleteRow('${t._id}','transactions')" class="text-red-400 hover:text-red-600 text-xs font-bold">🗑</button></td>
      </tr>`;
    });
    html += '</tbody></table></div>';
    el.innerHTML = html;
  };

  // ============================================================
  // ⚙️ SETTINGS
  // ============================================================
  const loadSettings = async () => {
    const el = document.getElementById('sectionContent');
    el.innerHTML = `
      <div class="space-y-4">
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
          <h3 class="font-black text-blue-900 mb-2">⚙️ ตั้งค่าระบบ</h3>
          <p class="text-sm text-blue-700">จัดการค่าต่างๆ ของระบบ Heddee</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Default Goals -->
          <div class="bg-white border border-gray-200 rounded-lg p-4">
            <h4 class="font-bold text-gray-800 mb-3">🎯 ค่าเริ่มต้นผู้ใช้ใหม่</h4>
            <div class="space-y-3">
              <div>
                <label class="text-xs font-bold text-gray-500">เป้าหมายแคลอรี่เริ่มต้น (kcal)</label>
                <input id="s_defaultCal" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" value="2000">
              </div>
              <div>
                <label class="text-xs font-bold text-gray-500">เป้าหมายออกกำลังกายเริ่มต้น (kcal)</label>
                <input id="s_defaultEx" type="number" class="w-full border rounded-lg px-3 py-2 text-sm mt-1" value="300">
              </div>
              <button onclick="saveDefaultGoals()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold px-4 py-2 rounded-lg text-sm">💾 บันทึกค่าเริ่มต้น</button>
            </div>
          </div>

          <!-- Admin UIDs -->
          <div class="bg-white border border-gray-200 rounded-lg p-4">
            <h4 class="font-bold text-gray-800 mb-3">🔐 Admin UIDs</h4>
            <p class="text-xs text-gray-400 mb-2">UID ที่มีสิทธิ์เข้าถึง Admin Panel (คั่นด้วยคอมม่า)</p>
            <textarea id="s_adminUidsList" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">${ADMIN_UIDS.join(',')}</textarea>
            <p class="text-xs text-gray-400 mt-1">⚠️ ต้องอัปเดตใน lib/firebase.js ด้วย</p>
          </div>

          <!-- System Stats -->
          <div class="bg-white border border-gray-200 rounded-lg p-4">
            <h4 class="font-bold text-gray-800 mb-3">📊 สถิติระบบ</h4>
            <div id="systemStatsContent">
              <p class="text-gray-400 text-sm">กำลังโหลด...</p>
            </div>
          </div>

          <!-- Danger Zone -->
          <div class="bg-red-50 border border-red-200 rounded-lg p-4">
            <h4 class="font-bold text-red-800 mb-3">⚠️ Danger Zone</h4>
            <div class="space-y-2">
              <button onclick="clearAllData()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold px-4 py-2 rounded-lg text-sm">🗑 ลบข้อมูลทั้งหมด</button>
              <p class="text-xs text-red-500">⚠️ การกระทำนี้ไม่สามารถย้อนกลับได้</p>
            </div>
          </div>
        </div>
      </div>
    `;

    // Load system stats
    try {
      const [usersSnap, foodSnap, exSnap, healthSnap] = await Promise.all([
        getDocs(collection(db, 'users')),
        getDocs(collection(db, 'foodLogs')),
        getDocs(collection(db, 'exerciseLogs')),
        getDocs(collection(db, 'healthLogs'))
      ]);
      document.getElementById('systemStatsContent').innerHTML = `
        <div class="space-y-2 text-sm">
          <p>👥 ผู้ใช้ทั้งหมด: <strong>${usersSnap.size}</strong> คน</p>
          <p>🍱 บันทึกอาหาร: <strong>${foodSnap.size}</strong> รายการ</p>
          <p>🏃 บันทึกออกกำลังกาย: <strong>${exSnap.size}</strong> รายการ</p>
          <p>📋 บันทึกสุขภาพ: <strong>${healthSnap.size}</strong> รายการ</p>
          <p class="text-xs text-gray-400 mt-2">อัปเดตล่าสุด: ${new Date().toLocaleString('th-TH')}</p>
        </div>
      `;
    } catch (err) {
      document.getElementById('systemStatsContent').innerHTML = `<p class="text-red-500 text-sm">โหลดไม่สำเร็จ: ${escapeHtml(err.message)}</p>`;
    }
  };

  window.saveSettings = async () => {
    const adminUids = document.getElementById('s_adminUids')?.value || '';
    const lineNotify = document.getElementById('s_lineNotify')?.value || 'true';
    try {
      const data = {
        adminUids: adminUids.split(',').map(uid => uid.trim()).filter(Boolean),
        lineNotifyEnabled: lineNotify === 'true',
        updatedAt: new Date().toISOString(),
        updatedBy: session?.uid || 'unknown'
      };
      await setDoc(doc(db, 'systemSettings', 'appConfig'), data, { merge: true });
      showToast('บันทึกการตั้งค่าระบบสำเร็จ');
      document.getElementById('settingsModal')?.classList.add('hidden');
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    }
  };

  window.closeSettingsModal = () => {
    document.getElementById('settingsModal')?.classList.add('hidden');
  };

  window.saveDefaultGoals = async () => {
    const cal = parseInt(document.getElementById('s_defaultCal').value) || 2000;
    const ex = parseInt(document.getElementById('s_defaultEx').value) || 300;
    try {
      await setDoc(doc(db, 'systemSettings', 'defaults'), {
        defaultCalorieGoal: cal,
        defaultExerciseGoal: ex,
        updatedAt: new Date().toISOString(),
        updatedBy: session?.uid || 'unknown'
      }, { merge: true });
      showToast('บันทึกค่าเริ่มต้นสำเร็จ');
    } catch (err) {
      showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
    }
  };

  window.clearAllData = async () => {
    if (!confirm('⚠️ คุณแน่ใจที่จะลบข้อมูลทั้งหมดในระบบ? การกระทำนี้ไม่สามารถย้อนกลับได้!')) return;
    if (!confirm('⚠️ ยืนยันอีกครั้ง: ลบข้อมูลผู้ใช้ อาหาร ออกกำลังกาย สุขภาพ ทั้งหมด?')) return;
    const pw = prompt('กรุณาพิมพ์ "DELETE" เพื่อยืนยัน');
    if (pw !== 'DELETE') return showToast('ยกเลิกการลบ', 'error');

    const collections = ['foodLogs', 'exerciseLogs', 'healthLogs', 'bodyStats', 'reminders', 'redemptions', 'transactions', 'missionCompletions', 'dailyCalorieSummaries', 'dailyExerciseSummaries', 'calorieNotifications'];
    let deleted = 0;
    for (const col of collections) {
      try {
        const snap = await getDocs(collection(db, col));
        const batch = [];
        snap.docs.forEach(d => batch.push(deleteDoc(doc(db, col, d.id))));
        await Promise.all(batch);
        deleted += snap.size;
      } catch (err) {
        console.warn(`⚠️ Failed to clear ${col}:`, err.message);
      }
    }
    showToast(`🗑 ลบข้อมูล ${deleted} รายการสำเร็จ`);
    loadSettings();
  };

  // ============================================================
  // 🚀 INIT
  // ============================================================
  if (isAdmin) {
    loadDashboard();
  }
</script>
</body>
</html>
